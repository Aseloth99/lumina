[package]
name = "lumina-launcher"
version = "1.0.0"
edition = "2021"
description = "Lumina.exe: unpacks the app once per version and starts it (instead of unpacking ~380 MB on every launch)"
publish = false

[[bin]]
name = "lumina_launcher"
path = "src/main.rs"

[dependencies]
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
